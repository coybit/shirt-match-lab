<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Shirt Match Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a textbook — chapter index on the left, one chapter at a time in a reading column, widgets as "lab benches" breaking out wider */
:root{
  --paper:#f5f6f0; --card:#ffffff; --ink:#15212b; --muted:#5a6670; --line:#d8dcd2;
  --accent:#0d7a49; --accent-ink:#ffffff; --flag:#e3b100; --bad:#c2372f; --good:#0d7a49;
  --grid:rgba(21,33,43,.08); --bench:#eef1ea;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-ui:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1613; --card:#16201c; --ink:#e6ede8; --muted:#93a39a; --line:#26342e;
  --accent:#3cc47f; --accent-ink:#06120c; --flag:#f0c419; --bad:#ef6a5f; --good:#3cc47f; --grid:rgba(230,237,232,.08); --bench:#121c18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1613; --card:#16201c; --ink:#e6ede8; --muted:#93a39a; --line:#26342e;
  --accent:#3cc47f; --accent-ink:#06120c; --flag:#f0c419; --bad:#ef6a5f; --good:#3cc47f; --grid:rgba(230,237,232,.08); --bench:#121c18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.6 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--accent)}
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}}
aside{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;font-family:var(--f-ui)}
@media (max-width:900px){aside{position:static;max-height:none}}
.brand{font:800 34px/.95 var(--f-display);text-transform:uppercase;margin:0 0 4px}
.brand span{color:var(--accent)}
.sub{font:14px/1.4 var(--f-ui);color:var(--muted);margin:0 0 14px}
.progress{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.progress div{height:100%;background:var(--accent);width:0}
.toc{display:grid;gap:2px;margin-top:12px}
.toc .part{font:700 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.toc button{all:unset;cursor:pointer;display:grid;grid-template-columns:26px 1fr 16px;gap:6px;align-items:baseline;padding:5px 8px;border-radius:6px;font:15px/1.3 var(--f-ui)}
.toc button:hover{background:var(--grid)}
.toc button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.toc .n{font:600 12px var(--f-mono);color:inherit;opacity:.7}
.toc .tick{color:var(--good);font-weight:700}
.toc button:focus-visible{outline:3px solid var(--flag)}
main{min-width:0}
.eyebrow{font:700 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:800 clamp(40px,6vw,64px)/.95 var(--f-display);text-transform:uppercase;margin:6px 0 10px;text-wrap:balance}
h2{font:800 28px/1.05 var(--f-display);text-transform:uppercase;margin:34px 0 8px;letter-spacing:.01em;text-wrap:balance}
.lead{font-size:20px;line-height:1.5;color:var(--muted);max-width:62ch}
.read p,.read li{max-width:66ch}
.meta{font:14px var(--f-ui);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.bench{background:var(--bench);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0;font-family:var(--f-ui);font-size:15px;line-height:1.45;min-width:0;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.bench .lab{font:700 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.def{border-left:4px solid var(--accent);background:var(--card);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0;max-width:66ch}
.def b:first-child{font:700 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block}
.formula{font:14px/1.5 var(--f-mono);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto;max-width:66ch}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:18px 0;font-family:var(--f-ui);font-size:16px;max-width:70ch}
.quiz .q{font-weight:700;margin-bottom:8px}
.quiz .opts{display:grid;gap:6px}
.quiz button.opt{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--paper)}
.quiz button.opt:focus-visible{outline:3px solid var(--flag)}
.quiz button.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--paper))}
.quiz button.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--paper))}
.quiz .why{margin-top:8px;font-size:15px}
.takeaways{background:var(--ink);color:var(--paper);border-radius:12px;padding:16px 18px;margin:26px 0;font-family:var(--f-ui)}
.takeaways h3{font:800 20px var(--f-display);text-transform:uppercase;margin:0 0 6px;letter-spacing:.03em}
.takeaways li{margin:4px 0}
.more{font:15px var(--f-ui)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{font:700 14px/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--f-ui);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select,input[type=number]{font:15px var(--f-ui);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border-top:3px solid var(--ink);padding-top:6px}
.kpi .v{font:800 30px/1 var(--f-display)}
.kpi .l{font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto}
.small{font-size:13px}.muted{color:var(--muted)}.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg text{fill:var(--ink);font-family:var(--f-ui)}
svg .gridl{stroke:var(--grid)} svg .axis{stroke:var(--line)}
table.tbl{border-collapse:collapse;font-size:14px}
table.tbl th,table.tbl td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.heat td{text-align:center;font:12px var(--f-mono);padding:5px 4px;border:1px solid var(--paper)}
.heat th{font-size:11px;padding:3px;color:var(--muted)}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line);vertical-align:middle}
.tag{font:700 11px var(--f-ui);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--grid)}
.cardmini{display:inline-grid;justify-items:center;gap:2px;width:64px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:11px;text-align:center}
.cardmini svg{width:34px;height:34px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <p class="brand">Shirt Match <span>Academy</span></p>
    <p class="sub">Probability, game theory and discrete maths, taught through one childhood card game.</p>
    <div class="small muted" id="progLabel"></div>
    <div class="progress"><div id="progBar"></div></div>
    <nav class="toc" id="toc" aria-label="Chapters"></nav>
    <p class="small" style="margin-top:16px"><a href="index.html">← Back to Shirt Match Lab</a></p>
  </aside>
  <main id="main"><p class="muted">Loading the deck…</p></main>
</div>
<script src="engine.js"></script>
<script>
(async function(){
const E = window.Engine;
const $ = (s, r=document) => r.querySelector(s);
const h = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const k in attrs){ const v=attrs[k]; if(v==null) continue; if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); } for(const c of kids.flat()){ if(c==null) continue; e.append(c.nodeType?c:document.createTextNode(c)); } return e; };
const pct = (x,d=0) => (100*x).toFixed(d)+'%';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const W_ = t => 'https://en.wikipedia.org/wiki/' + t;
const GS = 'https://math.dartmouth.edu/~prob/prob/prob.pdf';

const [data, cfg, pre] = await Promise.all(['teams.json','assumptions.json','results.json'].map(f=>fetch(f).then(r=>r.json())));
const pool = E.buildPool(data, cfg);
const allCfg = JSON.parse(JSON.stringify(cfg)); allCfg.colour.rule='all';
const poolAll = E.buildPool(data, allCfg);
const SCH = pool.scheme, NM = E.SCHEMES[SCH];
const D0 = E.missTable(pool.masks, pool.F);
const q0 = E.matchProbability(pool);
const fam = E.familyFrequencies(pool).sort((a,b)=>b.p-a.p);
const famP = Object.fromEntries(fam.map(f=>[f.name,f.p]));
const teamIndex = new Map(data.teams.map(t=>[t[0],t]));
const bitOf = c => 1 << NM.indexOf(c);
const nameOf = m => E.maskNames(m, SCH).join(' + ');

/* ---------- drawing helpers ---------- */
let sid=0; const SHIRT='M13 5 L17 3 Q20 6 23 3 L27 5 L36 11 L32 17 L28 14 L28 37 L12 37 L12 14 L8 17 L4 11 Z';
function shirtFromHex(cols){ const id='s'+(sid++); let x=4,parts=''; const tot=cols.reduce((s,c)=>s+c[1],0)||1; for(const [hex,s] of cols){ const w=32*s/tot; parts+=`<rect x="${x.toFixed(2)}" y="0" width="${(w+0.3).toFixed(2)}" height="40" fill="#${hex}"/>`; x+=w; } return `<svg viewBox="0 0 40 40" aria-hidden="true"><defs><clipPath id="${id}"><path d="${SHIRT}"/></clipPath></defs><g clip-path="url(#${id})">${parts}</g><path d="${SHIRT}" fill="none" stroke="currentColor" stroke-opacity=".45"/></svg>`; }
function shirtFromMask(m, sch=SCH){ return shirtFromHex(E.maskNames(m,sch).map(c=>[E.SWATCH[c].slice(1),1])); }
function cardMini(e){ const t=teamIndex.get(e.team), cols=t&&t[10][e.kit]; return h('span',{class:'cardmini',title:e.team,html:(cols?shirtFromHex(cols):shirtFromMask(e.mask))+`<span>${e.team.replace(/ national (association )?football team/i,'').replace(/ F\.C\.$| FC$|^FC /,'').slice(0,14)}</span>`}); }
function dot(c){ return `<span class="sw" style="background:${E.SWATCH[c]}"></span>`; }
function barChart(pairs,{h:H=150,fmt=x=>x.toFixed(2),colors}={}){ const W=520,pad=24,bw=(W-pad*2)/pairs.length,mx=Math.max(...pairs.map(p=>p[1]))||1; let s=`<svg viewBox="0 0 ${W} ${H+28}" width="100%">`; s+=`<line class="axis" x1="${pad}" y1="${H}" x2="${W-pad}" y2="${H}"/>`;
  pairs.forEach(([l,v],i)=>{ const bh=(H-18)*v/mx,x=pad+i*bw; s+=`<rect x="${(x+2).toFixed(1)}" y="${(H-bh).toFixed(1)}" width="${Math.max(1,bw-4).toFixed(1)}" height="${bh.toFixed(1)}" fill="${colors?colors[i]:'var(--accent)'}" stroke="${colors?'var(--line)':'none'}" rx="2"/><text x="${(x+bw/2).toFixed(1)}" y="${H+14}" text-anchor="middle" font-size="11">${l}</text>`; if(v/mx>0.1&&bw>18) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-bh-4).toFixed(1)}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${fmt(v)}</text>`; });
  return h('div',{class:'scroll',html:s+'</svg>'}); }
function lineChart(series,{h:H=180,ymin=0,ymax=1,xlabel='',ylabel='',yfmt=v=>v,xmin,xmax}={}){ const W=520,L=44,Rr=12,T=10,B=26; const xs=series.flatMap(s=>s.pts.map(p=>p[0])); const x0=xmin??Math.min(...xs), x1=xmax??(Math.max(...xs)||1);
  const X=x=>L+(W-L-Rr)*(x-x0)/((x1-x0)||1), Y=y=>T+(H-T-B)*(1-(y-ymin)/((ymax-ymin)||1)); let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let k=0;k<=4;k++){ const yv=ymin+(ymax-ymin)*k/4; s+=`<line class="gridl" x1="${L}" x2="${W-Rr}" y1="${Y(yv)}" y2="${Y(yv)}"/><text x="${L-6}" y="${Y(yv)+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${yfmt(+yv.toFixed(3))}</text>`; }
  s+=`<text x="${W-Rr}" y="${H-5}" text-anchor="end" font-size="11" style="fill:var(--muted)">${xlabel}: ${+(+x0).toFixed(2)} → ${+(+x1).toFixed(2)}</text><text x="${L+6}" y="${T+10}" font-size="11" style="fill:var(--muted)">${ylabel}</text>`;
  for(const sr of series){ if(sr.dots){ for(const p of sr.pts) s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${sr.r||3}" fill="${sr.color}"/>`; continue; } s+=`<polyline fill="none" stroke="${sr.color}" stroke-width="${sr.w||2}" ${sr.dash?'stroke-dasharray="5 4"':''} points="${sr.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`; }
  const leg=series.filter(s=>s.label).map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px"><span style="width:14px;height:3px;background:${s.color};display:inline-block"></span>${s.label}</span>`).join('');
  return h('div',{class:'scroll',html:s+'</svg>'+(leg?`<div class="small">${leg}</div>`:'')}); }
function slider(label,{min,max,step,value,fmt=v=>v,id},on){ const out=h('span',{class:'mono small'}); const inp=h('input',{type:'range',min,max,step,value,id,'aria-label':label}); const upd=()=>{out.textContent=fmt(+inp.value);}; inp.addEventListener('input',()=>{upd();on(+inp.value);}); upd(); return [h('div',{},h('label',{class:'row small'},label,out),inp),inp]; }
const sampler = E.sampler(pool);
const typesTop = n => [...pool.masks].sort((a,b)=>b[1]-a[1]).slice(0,n);

/* ---------- progress (per viewer) ---------- */
const KEY='sma-progress-v1'; let prog={}; try{ prog=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ prog={}; }
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(prog)); }catch(e){} };

/* ---------- widgets ---------- */
const WG = {};

WG.lln = (el) => { // law of large numbers
  let counts = {}, total = 0, hist = []; const R = E.rng(17); const target = fam[0].name;
  const out = h('div'); const row = h('div',{class:'chips'});
  const draw = n => { for(let i=0;i<n;i++){ const e=sampler(R); const c=NM.find((_,j)=>e.mask>>j&1); counts[c]=(counts[c]||0)+1; total++; if(total<=200||total%10===0) hist.push([total,(counts[target]||0)/total]); } render(); };
  [1,10,100,1000].forEach(n=>row.append(h('button',{class:'chip',onclick:()=>draw(n)},'Draw '+n)));
  row.append(h('button',{class:'chip',onclick:()=>{counts={};total=0;hist=[];render();}},'Reset'));
  const render = () => { out.innerHTML=''; if(!total){ out.append(h('p',{class:'muted'},'Draw some cards to start.')); return; }
    out.append(lineChart([{pts:hist,color:css('--accent'),label:`share of ${target} cards so far`},{pts:[[1,famP[target]],[Math.max(2,total),famP[target]]],color:css('--flag'),dash:true,label:`true probability ${pct(famP[target],1)}`}],{h:170,ymin:0,ymax:Math.min(1,Math.max(0.6,famP[target]*2)),xlabel:'cards drawn',ylabel:'share',yfmt:v=>pct(v),xmin:1}));
    const cols=fam.filter(f=>f.p>0.009); out.append(h('div',{class:'small',html:`After <b>${total}</b> cards: `+cols.map(f=>`${dot(f.name)} ${f.name} ${pct((counts[f.name]||0)/total)} <span class="muted">(true ${pct(f.p)})</span>`).join(' · ')})); };
  el.append(row,out); render();
};

WG.sigma = (el) => { // P(match) = sum p^2
  const cols=['white','red','blue','black']; const w=[0.35,0.2,0.19,0.11]; const out=h('div');
  const sl=cols.map((c,i)=>slider(c,{min:0,max:1,step:0.01,value:w[i],id:'sg'+i,fmt:v=>v.toFixed(2)},v=>{w[i]=v;draw();})[0]);
  const draw=()=>{ const t=w.reduce((a,b)=>a+b,0)||1, p=w.map(x=>x/t), q=p.reduce((a,x)=>a+x*x,0);
    let s=`<svg viewBox="0 0 520 70" width="100%">`; let x=10; p.forEach((pi,i)=>{ const ww=500*pi; s+=`<rect x="${x}" y="8" width="${ww}" height="22" fill="${E.SWATCH[cols[i]]}" stroke="var(--line)"/><rect x="${x}" y="38" width="${500*pi*pi}" height="22" fill="${E.SWATCH[cols[i]]}" stroke="var(--ink)"/>`; x+=ww; }); s+=`<text x="10" y="6" font-size="9" style="fill:var(--muted)"></text></svg>`;
    out.innerHTML=''; out.append(h('div',{class:'small muted'},'Top bar: share of each colour (p). Bottom bar: p², the chance that both cards are that colour.'),h('div',{html:s}),
      h('div',{class:'kpis'},h('div',{class:'kpi'},h('div',{class:'v'},pct(q,1)),h('div',{class:'l'},'P(match) = Σp²')),h('div',{class:'kpi'},h('div',{class:'v'},(1/q).toFixed(2)),h('div',{class:'l'},'behaves like this many equal colours')),h('div',{class:'kpi'},h('div',{class:'v'},pct(1/cols.length,0)),h('div',{class:'l'},'lowest possible with 4 colours (all equal)'))),
      h('p',{class:'small',html:`The real deck of famous teams has P(match) = <b>${pct(q0,1)}</b>.`})); };
  el.append(h('div',{style:'display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))'},...sl),out); draw();
};

WG.cond = (el) => {
  const tt=typesTop(8); const sel=(id,def)=>{ const s=h('select',{id}); tt.forEach(([m,p])=>s.append(h('option',{value:m},nameOf(m)+' ('+pct(p)+')'))); s.value=String(def); return s; };
  const a1=sel('cd1',tt[0][0]), a2=sel('cd2',tt[0][0]); const out=h('div');
  const draw=()=>{ const x=+a1.value,y=+a2.value, p1=1-D0[x], miss=D0[x], p2=miss>0?(D0[x]-D0[x|y])/miss:0;
    out.innerHTML=`<svg viewBox="0 0 470 210" width="100%" style="max-width:520px"><defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
      <rect x="4" y="86" width="104" height="40" rx="6" fill="var(--card)" stroke="var(--ink)"/><text x="56" y="103" text-anchor="middle" font-size="11">their card meets</text><text x="56" y="118" text-anchor="middle" font-size="11" font-weight="700">your 1st (${nameOf(x)})</text>
      <path d="M108 100 L176 44" stroke="var(--muted)" stroke-width="2" marker-end="url(#ca)"/><path d="M108 112 L176 160" stroke="var(--muted)" stroke-width="2" marker-end="url(#ca)"/>
      <text x="128" y="62" font-size="12" font-weight="700" style="fill:var(--bad)">${pct(p1)}</text><text x="128" y="156" font-size="12" font-weight="700" style="fill:var(--good)">${pct(miss)}</text>
      <rect x="178" y="24" width="112" height="36" rx="6" fill="color-mix(in srgb,var(--bad) 15%,transparent)" stroke="var(--bad)"/><text x="234" y="46" text-anchor="middle" font-size="11">they take the pile</text>
      <rect x="178" y="142" width="112" height="40" rx="6" fill="var(--card)" stroke="var(--ink)"/><text x="234" y="159" text-anchor="middle" font-size="11">it missed; now your</text><text x="234" y="174" text-anchor="middle" font-size="11" font-weight="700">2nd (${nameOf(y)})</text>
      <path d="M290 156 L358 116" stroke="var(--muted)" stroke-width="2" marker-end="url(#ca)"/><path d="M290 168 L358 198" stroke="var(--muted)" stroke-width="2" marker-end="url(#ca)"/>

WG.pathcolour = (el) => { // no-repeat ordering = proper colouring of a path
  let seed=4; const out=h('div'); const btn=h('button',{class:'chip',onclick:()=>{seed++;run();}},'New 10-card hand');
  const run=()=>{ const R=E.rng(seed); const hand=Array.from({length:10},()=>NM.find((_,j)=>sampler(R).mask>>j&1)); const cnt={}; hand.forEach(c=>cnt[c]=(cnt[c]||0)+1); const mxc=Math.max(...Object.values(cnt)), lim=Math.ceil(hand.length/2);
    // greedy: always place the most frequent colour that differs from the previous
    const left={...cnt}, order=[]; let prev=null; for(let i=0;i<hand.length;i++){ const cand=Object.keys(left).filter(c=>left[c]>0&&c!==prev).sort((a,b)=>left[b]-left[a]); const c=cand[0]||Object.keys(left).find(c=>left[c]>0); order.push(c); left[c]--; prev=c; }
    const reps=order.slice(1).filter((c,i)=>c===order[i]).length; const row=cs=>cs.map((c,i)=>(i?`<span style="color:${c===cs[i-1]?'var(--bad)':'var(--good)'};font-weight:700">${c===cs[i-1]?'↺':'→'}</span>`:'')+`<span title="${c}" style="display:inline-block;width:22px;height:22px;border-radius:50%;background:${E.SWATCH[c]};border:1px solid var(--muted);vertical-align:middle"></span>`).join(' ');
    out.innerHTML=''; out.append(h('div',{class:'small',html:'Dealt: '+row(hand)}),h('div',{class:'small',html:'Greedy no-repeat order: '+row(order)}),
      h('p',{class:'small',html:`Biggest colour group: <b>${mxc}</b> cards (limit for a perfect order: ⌈n/2⌉ = ${lim}). ${mxc<=lim?`So a perfect order exists, and the greedy rule (“place the most common colour that isn’t the previous one”) found one with ${reps} repeats.`:`Too many cards of one colour: some repeats are unavoidable (at least ${mxc-lim}).`}`})); };
  el.append(btn,out); run(); };

WG.graph = (el) => { let seed=2; const out=h('div'); const btn=h('button',{class:'chip',onclick:()=>{seed++;run();}},'New hand'); const vr=h('select',{id:'gv'},h('option',{value:'dom'},'Your rule: one colour'),h('option',{value:'all'},'Variant: every colour'));

WG.matrix = (el) => { const tt=[...poolAll.masks].sort((a,b)=>b[1]-a[1]).slice(0,6); const K=tt.map(([a])=>tt.map(([b])=>(a&b)?1:0)); let v=tt.map(()=>1/Math.sqrt(6)), step=0; const out=h('div');

WG.incl = (el) => { const cs=['white','red','blue']; const out=h('div'); const sel=cs.map(c=>{ const b=h('button',{class:'chip','aria-pressed':c!=='blue'?'true':'false',onclick:()=>{ b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true'); draw(); }},c); return b; });
  const draw=()=>{ const on=cs.filter((c,i)=>sel[i].getAttribute('aria-pressed')==='true'); const P=poolAll; const masks=[...P.masks]; const NMa=E.SCHEMES[P.scheme]; const b=c=>1<<NMa.indexOf(c);
    const has=m=>masks.reduce((s,[x,p])=>s+((x&m)===m?p:0),0); const any=m=>masks.reduce((s,[x,p])=>s+((x&m)?p:0),0);

    const subsets=[]; for(let k=1;k<(1<<on.length);k++) subsets.push(on.filter((_,i)=>k>>i&1)); let total=0; const lines=subsets.map(S=>{ const sign=S.length%2?'+':'−'; const v=has(S.reduce((m,c)=>m|b(c),0)); total+=S.length%2?v:-v; return `${sign} P(${S.join(' & ')}) = ${sign}${(100*v).toFixed(1)}%`; });
    out.innerHTML=''; out.append(h('div',{class:'formula'},`P(${on.join(' or ')})\n`+lines.join('\n')+`\n= ${(100*total).toFixed(1)}%   (direct count: ${(100*any(on.reduce((m,c)=>m|b(c),0))).toFixed(1)}%)`),h('p',{class:'small'},'Every-colour variant, where a shirt can contain several of these colours. Add the singles, subtract the pairs, add back the triple: the alternating signs undo double counting exactly.')); };
  el.append(h('div',{class:'chips'},...sel),out); draw(); };

    ['p','Shuffling is a strategy. So is “rarest card first, then never repeat a colour”. Try any two strategies against each other:'],

    ['def','Payoff matrix and dominance','A table of results for every pair of strategies. Strategy A <b>dominates</b> B if A does at least as well as B against every opponent. A dominated strategy should never be played.'],
    ['w','payoff','Lab · the tournament as a payoff matrix'],
    ['quiz','Strategy X beats Y, Y beats Z, and Z beats X. Can there be a single best strategy?',['Yes, the one with the highest average','Not necessarily: like rock–paper–scissors, the best plan may be a mix'],1,'Cycles mean every pure strategy has a counter. Game theory’s answer is to randomise.'],
   ],
   take:['A strategy is a complete plan.','A payoff matrix compares every pair.','Never play a dominated strategy.'],
   links:[['Game Theory (Yale, Ben Polak)','https://oyc.yale.edu/economics/econ-159'],['Strategic dominance',W_('Strategic_dominance')],['Normal-form game',W_('Normal-form_game')]] },

 { id:'pennies', part:P3, title:'The heart of the game: matching pennies', min:12,
   lead:'Strip the game down to one decision and you find a famous game from 1944.',
   body:[
    ['p','You open a set and want <b>no</b> match. Your opponent answers and wants a match. If you each had only red and blue, that is exactly <b>matching pennies</b>, the simplest zero-sum game, studied by von Neumann and Morgenstern.'],
    ['w','pennies','Lab · try to beat a computer that learns your habits'],
    ['p','People are bad at being random: we alternate too much and avoid streaks. The computer spots those patterns. The only unbeatable plan is to be <b>truly random</b>, 50/50, and then it can’t do better than half. Try the “Play 100 truly random” button.'],
    ['def','Mixed strategy','Choosing between actions at random with fixed probabilities. In matching pennies the equilibrium mixed strategy is 50/50 for both players.'],
    ['quiz','Why does the 50/50 strategy guarantee you about half the rounds?',['Because the computer can’t predict a fair coin, whatever it does','Because the computer gets tired'],0,'Against a truly random 50/50 player, every reply wins exactly half the time, so no prediction helps.'],
   ],
   take:['Opening a set is a matching-pennies duel.','Predictable players get exploited.','Randomising is a strategy, not a lack of one.'],
   links:[['Matching pennies',W_('Matching_pennies')],['Mixed strategy',W_('Strategy_(game_theory)#Mixed_strategy')],['Theory of Games and Economic Behavior',W_('Theory_of_Games_and_Economic_Behavior')]] },

 { id:'minimax', part:P3, title:'Minimax: playing safe when stakes differ', min:12,
   lead:'What if a match on one colour costs you more than a match on the other? The best mix is no longer 50/50, and there’s a neat picture that finds it.',
   body:[
    ['p','Say a match on blue would hand over a bigger pile than a match on red. You open with red a share x of the time. If the opponent always answers red, you lose a·x cards on average. If they always answer blue, you lose b·(1−x). They’ll pick whichever hurts more.'],
    ['w','mixed','Lab · the graphical solution of a 2×2 zero-sum game'],
    ['def','Minimax theorem (von Neumann, 1928)','In every finite two-player zero-sum game there is a mix that minimises your worst-case loss, and the opponent’s best mix gives exactly the same value. Here the solution is x* = b/(a+b).'],
    ['p','The surprising part: you play the <b>expensive</b> colour <i>less</i>, but not never. If you never opened with it, the opponent would stop guarding against it.'],
    ['quiz','A match on red costs you 1 card and a match on blue costs 3. How often should you open with red?',['25%','50%','75%'],2,'x* = b/(a+b) = 3/(1+3) = 75%. Red is cheap, so you use it more, but you still mix in blue 25% of the time.'],
   ],
   take:['Zero-sum games have a minimax value.','The best mix makes the opponent indifferent.','In 2×2 games it’s where the two lines cross.'],
   links:[['Minimax theorem',W_('Minimax_theorem')],['Zero-sum game',W_('Zero-sum_game')],['Game Theory (Yale)','https://oyc.yale.edu/economics/econ-159']] },

 { id:'nash', part:P3, title:'Nash equilibrium of the whole game', min:10,
   lead:'With eleven strategies, how do you find the best mix? Let the strategies learn against each other.',
   body:[
    ['def','Nash equilibrium','A choice for every player such that nobody can do better by changing only their own choice. In zero-sum games it coincides with minimax.'],
    ['def','Fictitious play','Each round, each player picks the best reply to the opponent’s history so far. In zero-sum games the frequencies converge to an equilibrium (Robinson, 1951).'],
    ['w','fictitious','Lab · fictitious play over the tournament results'],
    ['p','If one strategy beat every other one, the equilibrium would simply be to play it. With the 20 strategies in our tournament that doesn’t happen: the chess gambit crushes cautious shield players but loses to the calculators; the tempo player beats the card counter but loses narrowly to the plain optimiser. So the equilibrium is a <b>mix</b>, led by the tempo lookahead, with the optimiser and the balanced (poker) opener mixed in. Being unpredictable has real value here.'],
    ['quiz','What does it mean if fictitious play settles on a single strategy?',['That strategy is a best reply to all the others, so it’s the equilibrium','The algorithm is broken'],0,'A strategy that’s a best reply to everything is a pure equilibrium; there’s no reason to mix.'],
   ],
   take:['Nash equilibrium: nobody gains by deviating alone.','Fictitious play learns it by repeated best replies.','Among our 20 strategies the equilibrium is a mix, not a single winner.'],
   links:[['Nash equilibrium',W_('Nash_equilibrium')],['Fictitious play',W_('Fictitious_play')],['Game Theory (Yale)','https://oyc.yale.edu/economics/econ-159']] },

 { id:'info', part:P3, title:'Information: Bayes and card counting', min:12,
   lead:'This is a game of imperfect information: you can’t see the opponent’s order. But every card that turns over is evidence.',
   body:[
    ['def','Bayesian updating','Start with a <b>prior</b> belief, observe evidence, and get a <b>posterior</b>: posterior ∝ likelihood × prior. Each card you see in the opponent’s hand replaces a guess with a fact.'],
    ['w','bayes','Lab · reveal the opponent’s cards one by one'],
    ['def','Entropy','Uncertainty measured in bits: H = −Σ p log₂ p. A fair coin is 1 bit, a sure thing 0 bits.'],
    ['p','Card counting lowers the uncertainty about what they’ll lay next. Knowing their whole hand still leaves some uncertainty, because you don’t know the order. In the tournament, memory alone added several points of win rate.'],
    ['quiz','You’ve seen that 8 of their 10 cards are white. What should your opener be?',['A white card','A non-white card, ideally a colour they don’t have'],1,'Their next card is very likely white. A white opener would probably be matched, so lead with a colour they’re unlikely to hold.'],
   ],
   take:['Prior + evidence → posterior.','Entropy measures what you don’t know.','Counting cards turns guesses into facts.'],
   links:[['Bayesian inference',W_('Bayesian_inference')],['Entropy (information theory)',W_('Entropy_(information_theory)')],['3Blue1Brown: Wordle and information theory','https://www.youtube.com/watch?v=v68zYyaEmEA']] },

 { id:'perm', part:P4, title:'Permutations: the space of orders', min:8,
   lead:'Reordering your hand means choosing a permutation. How many are there, and how do you search them?',
   body:[
    ['def','Permutation','An ordering of n objects. There are n! = n × (n−1) × … × 1 of them. 4! = 24, 10! = 3,628,800, 20! ≈ 2.4 × 10¹⁸.'],
    ['w','perm','Lab · every order of a 4-card hand, scored'],
    ['p','You can’t try 20! orders. The optimiser instead swaps two cards at a time (a <b>transposition</b>) and keeps the swap if it helps. Transpositions generate the whole <b>symmetric group</b> Sₙ, so any order can be reached this way.'],
    ['quiz','How many orders does a 5-card hand have?',['25','120','3,125'],1,'5! = 5 × 4 × 3 × 2 × 1 = 120.'],
   ],
   take:['n cards → n! orders.','Swaps (transpositions) reach every order.','Local search swaps until nothing improves.'],
   links:[['Permutation',W_('Permutation')],['Symmetric group',W_('Symmetric_group')],['Group Explorer','https://nathancarter.github.io/group-explorer/']] },

 { id:'graphs', part:P4, title:'Graphs and colouring', min:12,
   lead:'Draw cards as dots and matches as lines, and strategy questions turn into graph questions.',
   body:[
    ['def','Graph','Vertices (dots) joined by edges (lines). A <b>clique</b> is a set of vertices all joined to each other.'],
    ['w','graph','Lab · the match graph of a hand'],
    ['p','Your ordered hand is a <b>path</b>: card 1 – card 2 – card 3 … The zig-zag rule says neighbouring cards must have different colours. That’s exactly a <b>proper colouring of a path graph</b>.'],
    ['def','When is a no-repeat order possible?','You can order n coloured cards with no two neighbours alike if and only if no colour holds more than ⌈n/2⌉ of them. Placing “the most common colour that isn’t the previous one” always finds such an order.'],
    ['w','pathcolour','Lab · find a no-repeat order'],
    ['quiz','You hold 7 cards: 5 white, 1 red, 1 blue. Can you order them with no two whites side by side?',['Yes','No'],1,'⌈7/2⌉ = 4, but you have 5 whites. With only 2 other cards to separate them, at most 3 whites can be kept apart.'],
   ],
   take:['Matches form a graph; one colour per card gives separate cliques.','A no-repeat order is a proper colouring of a path.','Possible exactly when no colour exceeds ⌈n/2⌉.'],
   links:[['Network Science (free book)','https://networksciencebook.com/'],['Graph coloring',W_('Graph_coloring')],['Clique (graph theory)',W_('Clique_(graph_theory)')]] },

 { id:'linalg', part:P4, title:'Matrices and eigenvectors', min:10,
   lead:'Tables of numbers can act on lists of numbers. Repeat that action and a special list, the eigenvector, appears.',
   body:[
    ['def','Matrix as an action','Multiplying a vector by a matrix K mixes its entries. P(match) = pᵀKp, where K[i][j] = 1 if card types i and j match.'],
    ['p','With your rule, K is the identity (a card only matches its own colour), so pᵀKp = Σp², chapter 2 again. In the every-colour variant K has extra 1s and becomes interesting: multiply any vector by K again and again and it lines up with the <b>Perron eigenvector</b>, which ranks shirts by how central they are. Google’s PageRank used the same idea.'],
    ['w','matrix','Lab · power iteration step by step'],
    ['quiz','With one colour per card, what is the compatibility matrix K?',['All ones','The identity matrix','All zeros'],1,'Each type matches only itself, so K has 1s on the diagonal and 0s elsewhere.'],
   ],
   take:['P(match) is a quadratic form pᵀKp.','Repeated multiplication finds the main eigenvector.','Perron–Frobenius guarantees a positive one.'],
   links:[['3Blue1Brown: Essence of linear algebra','https://www.3blue1brown.com/topics/linear-algebra'],['MIT 18.06 Linear Algebra','https://ocw.mit.edu/courses/18-06sc-linear-algebra-fall-2011/'],['Power iteration',W_('Power_iteration')]] },

 { id:'ie', part:P4, title:'Counting overlaps: inclusion–exclusion', min:8,
   lead:'How likely is a card to match at least one of several colours? Adding probabilities double-counts. Here’s the fix.',
   body:[
    ['def','Inclusion–exclusion','P(A or B or C) = P(A) + P(B) + P(C) − P(A&B) − P(A&C) − P(B&C) + P(A&B&C). Add singles, subtract pairs, add triples…'],
    ['w','incl','Lab · pick colours and watch the terms cancel'],
    ['p','With one colour per card, a card can’t be two colours at once, so all the overlap terms are 0 and you just add. In the every-colour variant they matter. The engine computes these sums for all colour sets at once using a “subset-sum” pass over the <b>Boolean lattice</b>, the inverse of Möbius inversion.'],
    ['quiz','30% of shirts contain white, 25% contain red and 10% contain both. What share contains white or red?',['55%','45%','65%'],1,'30% + 25% − 10% = 45%.'],
   ],
   take:['Add, subtract the double-counted, add back the triple-counted.','With one colour per card, overlaps vanish.','The Boolean lattice organises all colour sets.'],
   links:[['Inclusion–exclusion principle',W_('Inclusion%E2%80%93exclusion_principle')],['Möbius inversion formula',W_('M%C3%B6bius_inversion_formula')],['Hasse diagram',W_('Hasse_diagram')]] },

 { id:'cycles', part:P4, title:'Why some games never end', min:10,
   lead:'Can a game go on forever? For deterministic play the answer comes from one of the simplest ideas in mathematics.',
   body:[
    ['def','Pigeonhole principle','Put more letters than pigeonholes and some hole gets two. A deterministic system with finitely many states must eventually revisit a state, and then it repeats forever.'],
    ['w','cycle','Lab · deterministic players vs random players'],
    ['p','When both players “never reorder”, the whole game is deterministic. Some deals fall into a loop and the card counts stop moving. Shuffling breaks loops: as Lakshtanov and Roshchina proved for War, a little randomness makes the expected game length finite. In 2024 a never-ending game of Beggar-my-neighbour was finally found, answering a question posed by John Conway.'],
    ['quiz','Why can’t a game between two random shufflers loop forever (with probability 1)?',['Because from every position there’s a positive chance of moving toward an end','Because random players are smarter'],0,'Randomness keeps a door open: some sequence of shuffles leads to the end, and over infinite time it will be found.'],
   ],
   take:['Finite + deterministic ⇒ eventually periodic.','Randomness breaks cycles.','Open problems hide in simple card games.'],
   links:[['Pigeonhole principle',W_('Pigeonhole_principle')],['A Non-Terminating Game of Beggar-My-Neighbor (2024)','https://arxiv.org/abs/2403.13855'],['Finiteness in the Card Game of War','https://arxiv.org/abs/1007.1371']] },
];

/* ---------- rendering ---------- */
const doneCount = () => CH.filter(c=>prog[c.id]?.done).length;
function renderToc(cur){ const t=$('#toc'); t.innerHTML=''; let part=null;
  CH.forEach((c,i)=>{ if(c.part!==part){ part=c.part; t.append(h('div',{class:'part'},part)); }
    t.append(h('button',{'aria-current':String(c.id===cur),onclick:()=>go(c.id)},h('span',{class:'n'},String(i+1).padStart(2,'0')),h('span',{},c.title),h('span',{class:'tick'},prog[c.id]?.done?'✓':''))); });
  $('#progBar').style.width=(100*doneCount()/CH.length).toFixed(0)+'%'; $('#progLabel').textContent=`${doneCount()} of ${CH.length} chapters completed`; }
function quizEl(ch, qi, [q,opts,ans,why]){ const box=h('div',{class:'quiz'}); box.append(h('div',{class:'small muted',style:'font-weight:700;text-transform:uppercase;letter-spacing:.08em'},'Check yourself'),h('div',{class:'q'},q)); const o=h('div',{class:'opts'}); const res=h('div',{class:'why'});
  const prev=prog[ch.id]?.quiz?.[qi];
  const mark=(i)=>{ [...o.children].forEach((b,j)=>{ b.classList.toggle('right',j===ans&&(i===ans||i!=null)); b.classList.toggle('wrong',j===i&&i!==ans); }); res.innerHTML=(i===ans?'<b style="color:var(--good)">Right.</b> ':'<b style="color:var(--bad)">Not quite.</b> ')+why; };
  opts.forEach((t,i)=>o.append(h('button',{class:'opt',onclick:()=>{ prog[ch.id]=prog[ch.id]||{}; prog[ch.id].quiz=prog[ch.id].quiz||{}; prog[ch.id].quiz[qi]=i; save(); mark(i); }},t)));
  box.append(o,res); if(prev!=null) setTimeout(()=>mark(prev)); return box; }
function go(id, scroll=true){
  const i=CH.findIndex(c=>c.id===id), ch=CH[i]||CH[0]; const m=$('#main'); m.innerHTML=''; let qi=0;
  m.append(h('div',{class:'eyebrow'},ch.part+' · Chapter '+(i+1)),h('h1',{},ch.title),h('div',{class:'meta'},h('span',{},'About '+ch.min+' minutes'),(()=>{const nl=ch.body.filter(b=>b[0]==='w').length;return h('span',{},nl+(nl===1?' lab':' labs'));})(),(()=>{const nq=ch.body.filter(b=>b[0]==='quiz').length;return h('span',{},nq+(nq===1?' question':' questions'));})()),h('p',{class:'lead'},ch.lead));
  const read=h('div',{class:'read'});
  for(const b of ch.body){
    if(b[0]==='p') read.append(h('p',{html:b[1]}));
    else if(b[0]==='def') read.append(h('div',{class:'def',html:`<b>${b[1]}</b>${b[2]}`}));
    else if(b[0]==='formula') read.append(h('div',{class:'formula'},b[1]));
    else if(b[0]==='w'){ const bench=h('div',{class:'bench'},h('div',{class:'lab'},b[2])); const body=h('div',{style:'min-width:0'}); bench.append(body); read.append(bench); try{ WG[b[1]](body); }catch(e){ console.error(e); body.append(h('p',{class:'muted'},'This lab could not start.')); } }
    else if(b[0]==='quiz') read.append(quizEl(ch, qi++, b.slice(1)));
  }
  m.append(read);
  m.append(h('div',{class:'takeaways'},h('h3',{},'Key takeaways'),h('ul',{},...ch.take.map(t=>h('li',{},t)))));
  m.append(h('div',{class:'more'},h('b',{},'Go further: '),...ch.links.flatMap(([t,u],k)=>[k?' · ':'',h('a',{href:u,target:'_blank',rel:'noopener'},t)])));
  const doneBtn=h('button',{class:prog[ch.id]?.done?'btn ghost':'btn',onclick:()=>{ prog[ch.id]=prog[ch.id]||{}; prog[ch.id].done=!prog[ch.id].done; save(); renderToc(ch.id); doneBtn.textContent=prog[ch.id].done?'Completed ✓':'Mark chapter as done'; doneBtn.className=prog[ch.id].done?'btn ghost':'btn'; }},prog[ch.id]?.done?'Completed ✓':'Mark chapter as done');
  m.append(h('div',{class:'nav'},i>0?h('button',{class:'btn ghost',onclick:()=>go(CH[i-1].id)},'← '+CH[i-1].title):h('span'),doneBtn,i<CH.length-1?h('button',{class:'btn',onclick:()=>{ prog[ch.id]=prog[ch.id]||{}; prog[ch.id].done=true; save(); go(CH[i+1].id); }},CH[i+1].title+' →'):h('span')));
  renderToc(ch.id); prog.last=ch.id; save(); try{ history.replaceState(null,'','#'+ch.id); }catch(e){}
  if(scroll) window.scrollTo({top:0,behavior:'instant'});
}
const start=(location.hash||'').slice(1);
go(CH.some(c=>c.id===start)?start:(prog.last&&CH.some(c=>c.id===prog.last)?prog.last:'intro'), false);
})();
